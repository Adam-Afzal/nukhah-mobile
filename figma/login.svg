<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Background -->
  <rect width="390" height="844" fill="#0A0E1A"/>

  <!-- Status bar -->
  <text x="24" y="22" font-size="12" font-weight="600" fill="#E8D7B5" font-family="system-ui, -apple-system, sans-serif">9:41</text>
  <text x="366" y="22" font-size="12" fill="#E8D7B5" font-family="system-ui, -apple-system, sans-serif" text-anchor="end">●●● ▲ 100%</text>

  <!-- Back button -->
  <text x="24" y="76" font-size="16" font-weight="600" fill="#C9A961" font-family="system-ui, -apple-system, sans-serif">← Back</text>

  <!-- Title -->
  <text x="24" y="140" font-size="40" font-weight="700" font-style="italic" fill="#C9A961" font-family="Georgia, 'Times New Roman', serif">Welcome Back</text>

  <!-- Subtitle -->
  <text x="24" y="170" font-size="16" fill="#E8D7B5" font-family="system-ui, -apple-system, sans-serif">Log in to check your application status</text>

  <!-- Email -->
  <text x="24" y="212" font-size="14" font-weight="500" fill="#E8D7B5" font-family="system-ui, -apple-system, sans-serif">Email</text>
  <rect x="24" y="222" width="342" height="48" rx="8" fill="#1A1F2E" stroke="#C9A961" stroke-opacity="0.3" stroke-width="1"/>
  <text x="40" y="251" font-size="15" fill="#7B8799" font-family="system-ui, -apple-system, sans-serif">your.email@example.com</text>

  <!-- Password -->
  <text x="24" y="306" font-size="14" font-weight="500" fill="#E8D7B5" font-family="system-ui, -apple-system, sans-serif">Password</text>
  <rect x="24" y="316" width="342" height="48" rx="8" fill="#1A1F2E" stroke="#C9A961" stroke-opacity="0.3" stroke-width="1"/>
  <text x="40" y="345" font-size="15" fill="#7B8799" font-family="system-ui, -apple-system, sans-serif">Enter your password</text>

  <!-- Log In button -->
  <rect x="24" y="376" width="342" height="56" rx="8" fill="#C9A961"/>
  <text x="195" y="410" font-size="16" font-weight="700" fill="#0A0E1A" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Log In</text>

  <!-- Forgot password -->
  <text x="195" y="464" font-size="14" fill="#E8D7B5" text-decoration="underline" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Forgot your password?</text>

  <!-- Divider -->
  <line x1="24" y1="512" x2="172" y2="512" stroke="#E7EAF0" stroke-opacity="0.3" stroke-width="1"/>
  <text x="195" y="516" font-size="14" fill="#7B8799" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">or</text>
  <line x1="218" y1="512" x2="366" y2="512" stroke="#E7EAF0" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Sign Up link -->
  <text x="195" y="566" font-size="14" fill="#E8D7B5" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Don't have an account? <tspan font-weight="600" fill="#C9A961">Sign Up</tspan></text>

  <!-- Imam Portal link -->
  <text x="195" y="608" font-size="13" fill="#7B8799" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">Are you an imam? <tspan font-weight="600" fill="#C9A961">Log in here</tspan></text>
</svg>
